name: WRITE-01 isolated Electron regression (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  write01:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --test tests/e2e/write-ack-uncertainty.test.mjs tests/e2e/resume.test.mjs tests/e2e/workspace.test.mjs
