<script>
const datasets=JSON.parse(document.getElementById('fixture-data').textContent);
const main=document.getElementById('main');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let scenario='vivarium', state;
function fresh(){return{created:false,view:'home',selected:null,scope:'all',requirements:new Set(),actions:new Set(),activeScopes:new Set(),picksReq:new Set(),picksAction:new Set(),picksScope:new Set(),placements:{},work:{},focus:null,events:[],checkpoints:[],draft:{accomplished:'',next:'',problem:'',questions:''},reviewPlacement:'source',query:'',notice:''}}
function records(kind){return datasets[scenario].records.filter(r=>!kind||r.kind===kind).map(r=>state.created&&state.placements[r.id]?{...r,...state.placements[r.id]}:r)}
function get(id){return records().find(r=>r.id===id)}
function title(id){return get(id)?.title??'Missing record'}
function btn(text,action,extra='',primary=false){return `<button ${primary?'class="primary"':''} data-action="${action}" ${extra}>${esc(text)}</button>`}
function open(id,label){return btn(label??title(id),'select',`data-id="${esc(id)}" data-open="${esc(id)}"`)}
function event(text,id=null){state.events.push({text,id})}
function status(id){return !state.actions.has(id)?'Proposed':state.work[id]==='done'?'Done':state.work[id]==='doing'?'In progress':'Committed · not started'}
function task(r){return `<article class="task ${state.selected===r.id?'active-target':''}">${open(r.id)}<small>${esc(status(r.id))}</small></article>`}
function matching(r){return state.scope==='all'||(state.scope==='unscoped'?!r.scope:r.scope===state.scope)}
function resume(){const c=state.checkpoints.at(-1);return `<aside class="panel resume" aria-label="Resume Development"><p class="eyebrow">Resume Development</p>${c?`<h2>${esc(title(c.target))}</h2><h3>Last accomplishment</h3><p>${esc(c.accomplished)}</p><h3>Saved next step</h3><p>${esc(c.next)}</p>${c.problem?`<h3>Problem</h3><p>${esc(c.problem)}</p>`:''}${c.questions?`<h3>Saved questions</h3><p>${esc(c.questions)}</p>`:''}${btn('Continue saved work','continue','',true)}`:`<h2>Leave a place to continue</h2><p>No checkpoint saved in this design session.</p>${state.focus?`<p>Chosen focus: ${esc(title(state.focus))}</p>`:''}<small>Select work, then save your accomplishment and next step. No work session is inferred.</small>`}</aside>`}
function home(){const p=records('project')[0];return `<header class="heading"><div><p class="eyebrow">Home · Development workspace</p><h1>${state.created?'Your project':'Turn a plan into working context'}</h1><p class="muted">${state.created?'Continue what you explicitly saved.':'Review once. Keep the relationships. Choose where to begin.'}</p></div></header>${state.created?`<article class="panel"><h2>${esc(p.title)}</h2><p>${esc(p.goal)}</p>${state.checkpoints.length?`<p>Saved next step: ${esc(state.checkpoints.at(-1).next)}</p>`:'<p class="muted">No saved checkpoint yet.</p>'}<div class="actions">${btn(state.checkpoints.length?'Continue saved work':'Open project',state.checkpoints.length?'continue':'project','',true)}</div></article>`:`<section class="panel"><h2>${esc(p.title)}</h2><p>${esc(p.goal)}</p><p class="muted">Selected design blueprint; this is not an existing app project.</p>${btn('Review this blueprint','review','',true)}</section>`}`}
function review(){const rs=records('requirement').filter(r=>!state.requirements.has(r.id)),as=records('action').filter(r=>!state.actions.has(r.id)),ss=records('scope').filter(r=>!state.activeScopes.has(r.id));return `<header class="heading"><div><p class="eyebrow">Blueprint review · Nothing applied</p><h1>${esc(records('project')[0].title)}</h1><p>${esc(records('project')[0].goal)}</p></div>${btn('Cancel review','home')}</header><section class="panel"><h2>What this plan describes</h2><div class="grid">${records('feature').map(f=>`<div class="card">${open(f.id)}<small>${records('requirement').filter(r=>r.features.includes(f.id)).length} linked requirement definitions</small></div>`).join('')}</div><p class="muted">${rs.length} requirement definitions · ${as.length} proposed actions · ${records('decision').length} proposed decisions · ${records('check').length} planned checks. No completion or verification is imported.</p></section>${scenario==='vivarium'?`<aside class="panel warning"><strong>Design-review question, identified by the reviewer</strong><p>“No third-party runtime code” and the proposed Three.js stack need clarification. ProjectsTimeline cannot detect this semantic conflict from ordinary prose.</p>${open('req.clean-room','Inspect the requirement')}${open('dec.stack-choice','Inspect the proposed decision')}</aside>`:''}<section class="panel"><h2>Choose the effects explicitly</h2><p>Create a new project from all validated definitions. Unselected work stays proposed; decisions stay proposed and checks stay planned.</p><details><summary>Existing-project attachment: proposed safe path</summary><p>Choose an existing project, bind identity deliberately, compare changes and resolve conflicts before a separate atomic attachment. Names never identify records. Attachment is outside this new-project interaction study.</p></details><h3>Requirements: accept definitions (${state.picksReq.size} selected)</h3><div class="actions">${btn('Select all requirement definitions','all-req')}${btn('Clear requirements','clear-req')}</div><details><summary>Inspect and adjust ${rs.length} requirements</summary><div class="choices">${rs.map(r=>`<label><input type="checkbox" data-pick="requirement" value="${esc(r.id)}" ${state.picksReq.has(r.id)?'checked':''}>${esc(r.title)}<small> · ${esc(r.type)}; ${(r.acceptance??[]).length} acceptance statements</small></label>`).join('')}</div></details><h3>Actions: commit intended work (${state.picksAction.size} selected)</h3><div class="actions">${btn('Select all planned actions','all-actions')}${btn('Select unscoped actions only','unscoped-actions')}${btn('Clear actions','clear-actions')}</div><details><summary>Inspect and adjust ${as.length} actions</summary><div class="choices">${as.map(r=>`<label><input type="checkbox" data-pick="action" value="${esc(r.id)}" ${state.picksAction.has(r.id)?'checked':''}>${esc(r.title)}<small> · ${r.scope?esc(title(r.scope))+' / '+esc(r.stage??'Unassigned'):'Unscoped'}</small></label>`).join('')}</div></details><h3>Scope activation is separate</h3><div class="choices">${ss.map(s=>`<label><input type="checkbox" data-pick="scope" value="${esc(s.id)}" ${state.picksScope.has(s.id)?'checked':''}>Activate ${esc(s.title)} with its authored inline stages</label>`).join('')}</div><label>Placement for selected actions<select id="placement"><option value="source" ${state.reviewPlacement==='source'?'selected':''}>Keep proposed scope/stage placement (requires activation)</option><option value="unscoped" ${state.reviewPlacement==='unscoped'?'selected':''}>Explicitly work unscoped; retain original proposal as provenance</option></select></label><div class="panel"><h3>Apply summary</h3><p>New project · ${records('feature').length} permanent features · ${state.picksReq.size} accepted requirement definitions · ${state.picksAction.size} committed actions · ${state.picksScope.size} activated scopes.</p><p class="muted">${as.length-state.picksAction.size} actions remain proposed. Acceptance is not evidence or completion.</p><p class="status" role="status">${esc(state.notice)}</p>${btn(state.created?'Apply additional choices':'Create project with these choices','apply','',true)}</div></section>${detail()}`}
function featureMap(){const fs=records('feature');return `<section class="panel"><h2>Feature map</h2><p class="muted">Product capabilities first. Select one to see its requirements, work and planned checks.</p><div class="grid">${fs.map(f=>`<article class="card map-group">${open(f.id)}<small>${f.component?esc(title(f.component)):'Project-wide feature'}</small><span>${records('action').filter(a=>a.features.includes(f.id)).length} directly linked actions</span></article>`).join('')}</div></section>`}
function stages(){let html='';for(const s of records('scope').filter(s=>state.scope==='all'||s.id===state.scope)){const stages=s.workflow?.stages??[];html+=`<section class="panel"><p class="eyebrow">${state.activeScopes.has(s.id)?'Active scope':'Preserved draft plan'}</p><h2>${esc(s.title)}</h2><p class="muted">Authored organization, not dates, dependencies or priority. Out-of-order work is allowed.</p><div class="stages">${stages.map((st,i)=>`<section class="stage"><h3>${i+1}. ${esc(st.title)}</h3>${records('action').filter(a=>a.scope===s.id&&a.stage===st.key).map(task).join('')||'<p class="empty">No actions assigned.</p>'}</section>`).join('')}</div></section>`}if(state.scope==='all'||state.scope==='unscoped')html+=`<section class="panel"><h2>Unscoped work</h2>${records('action').filter(a=>!a.scope).map(task).join('')||'<p class="empty">No unscoped actions.</p>'}</section>`;return html||'<section class="panel">No stage plan for this filter. Features remain available.</section>'}
function detail(){const r=get(state.selected);if(!r)return'';let body=`<p class="eyebrow">${esc(r.kind)} · ${r.kind==='action'?esc(status(r.id)):r.kind==='requirement'?(state.requirements.has(r.id)?'Accepted definition':'Draft definition'):r.kind==='decision'?'Proposed decision':r.kind==='check'?'Planned · not run':'Project structure'}</p><h2 id="selected-title" tabindex="-1">${esc(r.title)}</h2>`;
if(r.kind==='feature'){const reqs=records('requirement').filter(q=>q.features.includes(r.id));const actions=records('action').filter(a=>a.features.includes(r.id));const checks=records('check').filter(c=>c.requirements.some(id=>reqs.some(q=>q.id===id)));body+=`<h3>Requirement definitions</h3><div class="links">${reqs.map(q=>open(q.id)).join('')||'<p>None linked.</p>'}</div><h3>Directly linked work</h3>${actions.map(task).join('')||'<p>No action linked. Add work in the future workspace; do not infer it.</p>'}<h3>Planned checks through requirements</h3><div class="links">${checks.map(c=>open(c.id)).join('')||'<p>No planned check linked. Verification is not assessed.</p>'}</div>`}
if(r.kind==='action'){body+=`<dl><dt>What to do</dt><dd>${esc(r.instructions||'Instructions not recorded.')}</dd><dt>Definition of done</dt><dd>${esc(r.definition_of_done||'Not recorded.')}</dd><dt>Applicability</dt><dd>${esc(r.applicability||'Not recorded.')}</dd></dl><h3>Linked requirements</h3><div class="links">${r.requirements.map(id=>open(id)).join('')||'None linked.'}</div><h3>Features</h3><div class="links">${r.features.map(id=>open(id)).join('')}</div>`;if(state.created&&state.actions.has(r.id))body+=`<div class="actions">${btn('Start work','start',`data-id="${esc(r.id)}"`,true)}${btn(state.work[r.id]==='done'?'Reopen action':'Mark work done',state.work[r.id]==='done'?'reopen':'done',`data-id="${esc(r.id)}"`)}${btn('Save checkpoint','checkpoint',`data-id="${esc(r.id)}"`)}</div>`;else body+='<p class="muted">Proposed work cannot be completed. Choose commitment explicitly during review.</p>'}
if(r.kind==='requirement')body+=`<h3>Acceptance statements</h3><ul>${r.acceptance.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p>Verification: Not assessed. A completed action does not prove this requirement.</p><div class="links">${records('action').filter(a=>a.requirements.includes(r.id)).map(a=>open(a.id)).join('')}</div>`;
if(r.kind==='decision')body+=`<p>${esc(r.rationale)}</p><p class="muted">No accepted decision has been recorded by this study.</p>`;
if(r.kind==='check')body+=`<p>${esc(r.instructions)}</p><ul>${r.expected.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p class="muted">Planned ${esc(r.method??'unspecified')} check; no result or evidence.</p>`;
body+=`<details><summary>Source and technical traceability</summary><p>External identity: ${esc(r.id)}</p><p>Blueprint file: ${esc(r.sourceFile)}. Original captured definitions remain separate from local work state.</p></details>`;return `<section class="panel detail" aria-label="Selected detail">${btn('Back to workspace','close-detail')}<br>${body}</section>`}
function checkpoint(){const id=state.focus;return `<section class="panel checkpoint" aria-label="Save context"><h2>Leave useful context</h2><p>Linked work: ${esc(title(id))}</p><form id="checkpoint"><label>What actually happened<textarea data-draft="accomplished" required>${esc(state.draft.accomplished)}</textarea></label><label>Next step / saved intention<textarea data-draft="next" required>${esc(state.draft.next)}</textarea></label><details><summary>Problem and unresolved questions</summary><label>Problem<textarea data-draft="problem">${esc(state.draft.problem)}</textarea></label><label>Questions<textarea data-draft="questions">${esc(state.draft.questions)}</textarea></label></details><button class="primary" type="submit">Save linked checkpoint</button></form></section>`}
function workspace(){const p=records('project')[0],actions=records('action');const done=actions.filter(a=>state.actions.has(a.id)&&state.work[a.id]==='done').length;let body='';if(state.view==='overview')body=featureMap()+`<section class="panel"><h2>Choose meaningful work</h2><p>${state.actions.size} actions committed · ${done} marked done · ${actions.length-state.actions.size} still proposed.</p>${btn('Review remaining proposals','review')}<p>Verification: Not assessed. No priority or prerequisites are recorded in PTB v0.2.</p>${actions.filter(a=>state.actions.has(a.id)).map(task).join('')||'<p class="empty">No work committed. The blueprint structure is preserved; return to its review to choose work.</p>'}</section>`;
else if(state.view==='features')body=featureMap();else if(state.view==='stages')body=stages();else if(state.view==='history')body=`<section class="panel"><h2>Design-session history</h2><p class="muted">Only interactions you performed in this simulation. No source narrative became past work.</p><ol class="history">${state.events.map((e,i)=>`<li><small>Simulation event ${i+1}</small><p>${esc(e.text)}</p>${e.id?open(e.id,'Open linked work'):''}</li>`).join('')||'<li>No recorded interaction yet.</li>'}</ol></section>`;else if(state.view==='checkpoint')body=checkpoint();else if(state.view==='find')body=`<section class="panel"><h2>Find project context</h2>${records().filter(r=>(r.title+' '+r.id).toLowerCase().includes(state.query.toLowerCase())).map(r=>`<div class="row"><div>${open(r.id)}<small> · ${esc(r.kind)}</small></div></div>`).join('')||'<p>No matches. Clear the search or use another word.</p>'}</section>`;
return `<header class="heading"><div><p class="eyebrow">Project · Development workspace</p><h1>${esc(p.title)}</h1><p class="muted">${esc(p.goal)}</p></div></header><nav class="tabs" aria-label="Project views">${['overview','stages','features','history'].map(v=>btn(v[0].toUpperCase()+v.slice(1),'view',`data-view="${v}" aria-pressed="${state.view===v}"`)).join('')}</nav><form class="toolbar" id="find"><label for="search">Find context</label><input id="search" value="${esc(state.query)}" placeholder="Feature, action, requirement…"><button type="submit">Find</button><label for="scope">Work filter</label><select id="scope"><option value="all">All development</option><option value="unscoped" ${state.scope==='unscoped'?'selected':''}>Unscoped</option>${records('scope').map(s=>`<option value="${esc(s.id)}" ${state.scope===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select></form>${state.selected&&get(state.selected)?.kind==='action'&&!matching(get(state.selected))?`<section class="panel warning">Selected work is outside this filter. ${btn('Show all development','clear-filter')}</section>`:''}<div class="cockpit"><div>${body}${detail()}</div>${resume()}</div>`}
function render(focus){document.getElementById('case').value=scenario;main.innerHTML=state.view==='home'?home():state.view==='review'?review():workspace();if(focus)document.getElementById(focus)?.focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;state.notice='';if(a==='reset'){state=fresh()}else if(a==='home'){state.view='home';state.selected=null}else if(a==='review'){state.view='review'}else if(a==='project'){state.view=state.created?'overview':'review'}else if(a==='select'){state.selected=id;if(state.view==='home')state.view='overview'}else if(a==='close-detail'){state.selected=null}else if(a==='view'){state.view=b.dataset.view}else if(a==='all-req'){state.picksReq=new Set(records('requirement').filter(r=>!state.requirements.has(r.id)).map(r=>r.id))}else if(a==='clear-req'){state.picksReq.clear()}else if(a==='all-actions'){state.picksAction=new Set(records('action').filter(r=>!state.actions.has(r.id)).map(r=>r.id))}else if(a==='unscoped-actions'){state.picksAction=new Set(records('action').filter(r=>!r.scope&&!state.actions.has(r.id)).map(r=>r.id))}else if(a==='clear-actions'){state.picksAction.clear()}else if(a==='clear-filter'){state.scope='all'}else if(a==='apply'){const missing=records('action').filter(r=>state.picksAction.has(r.id)&&r.scope&&!state.activeScopes.has(r.scope)&&!state.picksScope.has(r.scope));if(missing.length&&state.reviewPlacement==='source'){state.notice='Selected scoped actions require explicit scope activation, or choose unscoped placement.';render();return}if(state.reviewPlacement==='unscoped')for(const r of records('action').filter(r=>state.picksAction.has(r.id)))state.placements[r.id]={scope:null,stage:null};for(const id of state.picksReq)state.requirements.add(id);for(const id of state.picksAction)state.actions.add(id);for(const id of state.picksScope)state.activeScopes.add(id);event((state.created?'Simulated adoption: ':'Simulated project formation: ')+state.picksReq.size+' requirement definitions accepted; '+state.picksAction.size+' actions committed. All other work stays proposed.');state.created=true;state.view='overview';state.selected=null;state.picksReq.clear();state.picksAction.clear();state.picksScope.clear()}else if(a==='start'){state.work[id]='doing';state.focus=id;event('You chose to start: '+title(id),id)}else if(a==='done'||a==='reopen'){state.work[id]=a==='done'?'done':'todo';event(a==='done'?'You marked work done: '+title(id):'You reopened: '+title(id),id)}else if(a==='checkpoint'){state.focus=id;state.resumeView=state.view;state.view='checkpoint';state.selected=null}else if(a==='continue'){const c=state.checkpoints.at(-1);if(c){state.view=c.view;state.scope=c.scope;state.selected=c.target;state.focus=c.target}}render(a==='select'||a==='continue'?'selected-title':null)});
document.addEventListener('change',e=>{if(e.target.id==='case'){scenario=e.target.value;state=fresh();render()}else if(e.target.id==='scope'){state.scope=e.target.value;render()}else if(e.target.id==='placement'){state.reviewPlacement=e.target.value;render()}else if(e.target.dataset.pick){const target=e.target.dataset.pick==='requirement'?state.picksReq:e.target.dataset.pick==='action'?state.picksAction:state.picksScope;e.target.checked?target.add(e.target.value):target.delete(e.target.value);render()}});
document.addEventListener('input',e=>{if(e.target.dataset.draft)state.draft[e.target.dataset.draft]=e.target.value});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='find'){state.query=document.getElementById('search').value;state.view='find';render()}else if(e.target.id==='checkpoint'){state.checkpoints.push({...state.draft,target:state.focus,view:state.resumeView??'overview',scope:state.scope});event('You saved a linked checkpoint',state.focus);state.draft={accomplished:'',next:'',problem:'',questions:''};state.view='overview';render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.selected){const id=state.selected;state.selected=null;render();document.querySelector(`[data-open="${CSS.escape(id)}"]`)?.focus()}});
state=fresh();render();
</script></body></html>
